<div
  id="chat-panel"
  class="panel no-print"
  style="display: none; margin-top: 20px; border-left: 4px solid var(--teal)"
>
  <div class="informe-header">
    <h2>Asistente Investigativo</h2>
    <p>
      Haz consultas específicas sobre los involucrados o los hechos documentados
      en esta noticia.
    </p>
  </div>
  <div
    id="chat-historial"
    style="
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 15px;
      font-size: 13px;
    "
  ></div>

  <div class="panel no-print" id="rosPanel" style="margin-top: 20px">
    <h2>Generador de Informes ROS (Comité y Gerencia)</h2>
    <div class="sub">
      Generación de informes de operaciones sospechosas imparciales y basados en
      evidencia.
    </div>
    <label>Plantilla o Indicaciones de la Gerencia</label>
    <textarea
      id="rosPlantilla"
      placeholder="Ej. 1. Resumen Ejecutivo, 2. Antecedentes del Cliente, 3. Inconsistencias Financieras, 4. Conclusión Técnica..."
    ></textarea>
    <label>Texto de Documentos / Adjuntos (PDF, Excel, Cartas)</label>
    <textarea
      id="rosDocumentos"
      placeholder="Pega aquí el contenido extraído de las fuentes documentales..."
    ></textarea>
    <button onclick="generarInformeROS()" class="gold">
      Generar Informe ROS Imparcial
    </button>
    <span
      id="rosStatus"
      style="font-size: 12px; margin-left: 10px; color: var(--gray)"
    ></span>
  </div>
  <div
    id="rosResultadoPanel"
    class="panel"
    style="display: none; margin-top: 20px"
  >
    <h3>Informe ROS Generado</h3>
    <div
      id="rosMotorBadge"
      style="font-size: 11px; color: var(--teal); margin-bottom: 10px"
    ></div>
    <pre
      id="rosContenido"
      style="white-space: pre-wrap; font-family: inherit; line-height: 1.6"
    ></pre>
  </div>
</div>
