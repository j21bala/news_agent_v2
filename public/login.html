<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión | SARLAFT Enterprise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">
        <h1 class="text-xl font-bold text-slate-800 mb-1">SARLAFT Enterprise</h1>
        <p class="text-sm text-slate-500 mb-6">Ingresa con tu cuenta corporativa.</p>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Correo</label>
                <input type="email" id="email" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Contraseña</label>
                <input type="password" id="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
            </div>
            <button type="submit" id="btn-login" class="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-bold hover:bg-slate-800 transition">
                Entrar
            </button>
            <p id="login-error" class="text-xs text-red-600 hidden"></p>
        </form>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        SarlaftAuth.redirectIfLoggedIn();

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const boton = document.getElementById('btn-login');
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');
            boton.disabled = true;
            boton.textContent = 'Verificando...';

            try {
                await SarlaftAuth.login(
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                window.location.href = '/index.html';
            } catch (err) {
                errorEl.textContent = 'Credenciales inválidas o cuenta no autorizada.';
                errorEl.classList.remove('hidden');
                boton.disabled = false;
                boton.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
