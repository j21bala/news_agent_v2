<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión | SARLAFT Enterprise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-[#f7f8fa] px-4 text-slate-950 antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-md flex-col justify-center py-12">
        <div class="mb-8">
            <div class="mb-8 flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-white text-sm font-semibold tracking-widest">S</div>
            <p class="mb-3 text-xs font-medium uppercase tracking-[0.18em] text-slate-500">SARLAFT Intelligence</p>
            <h1 class="text-3xl font-semibold tracking-tight">Inicia sesión</h1>
            <p class="mt-2 text-sm leading-6 text-slate-600">Accede a tu espacio de análisis seguro.</p>
        </div>

        <form id="form-login" class="space-y-5 rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <div>
                <label for="email" class="mb-2 block text-sm font-medium text-slate-800">Correo corporativo</label>
                <input type="email" id="email" name="email" required autocomplete="username"
                    class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200">
            </div>
            <div>
                <label for="password" class="mb-2 block text-sm font-medium text-slate-800">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                    class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200">
            </div>
            <button type="submit" id="btn-login"
                class="w-full rounded-lg bg-slate-950 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 disabled:cursor-wait disabled:opacity-60">
                Entrar
            </button>
            <p id="login-error" role="alert" class="hidden text-sm text-red-700"></p>
        </form>

        <p class="mt-6 text-center text-xs text-slate-500">Acceso privado para usuarios autorizados</p>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        SarlaftAuth.redirectIfLoggedIn();

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const boton = document.getElementById('btn-login');
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');
            boton.disabled = true;
            boton.textContent = 'Verificando...';

            try {
                await SarlaftAuth.login(
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                window.location.href = '/index.html';
            } catch (err) {
                errorEl.textContent = 'Credenciales inválidas o cuenta no autorizada.';
                errorEl.classList.remove('hidden');
                boton.disabled = false;
                boton.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
